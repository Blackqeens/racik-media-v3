# syntax=docker/dockerfile:1
# =============================================================================
# docker-compose.yml — Racik Media V3 Local Development Stack
# =============================================================================
# Perintah:
#   docker compose up -d          → Jalankan semua service
#   docker compose down           → Matikan semua service
#   docker compose down -v        → Matikan + hapus semua volume (reset data)
#   docker compose logs -f api    → Lihat log service tertentu
#
# Catatan:
#   - File ini HANYA untuk local development
#   - Production pakai managed services (Supabase cloud, Redis Cloud, dll)
#   - Port yang diekspos mengikuti .env.example
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database (mensimulasikan Supabase PostgreSQL)
  # Supabase di local dev menggunakan Supabase CLI, tapi untuk simplisitas
  # dev junior cukup PostgreSQL biasa dulu.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: racik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-racik_media_v3}
      POSTGRES_USER: ${POSTGRES_USER:-racik_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rahasia_lokal_123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run migrations saat pertama kali container dibuat
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-racik_admin} -d ${POSTGRES_DB:-racik_media_v3}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - racik_network

  # ---------------------------------------------------------------------------
  # Redis — Cache, session, rate limiting
  # Bukan master data — dapat dibangun ulang kapan saja
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: racik_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_lokal_123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_lokal_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - racik_network

  # ---------------------------------------------------------------------------
  # RabbitMQ — Message broker untuk Event-Driven Architecture
  # Management UI tersedia di: http://localhost:15672
  # Default login: guest / guest (hanya local dev!)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: racik_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-racik_events}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_lokal_123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-racik_v3}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP protocol
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - racik_network

  # ---------------------------------------------------------------------------
  # Meilisearch — Search engine untuk katalog, konten, dan jasa
  # Dashboard tersedia di: http://localhost:7700
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: racik_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch_lokal_secret_key_123}
      MEILI_ENV: development
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - racik_network

  # ---------------------------------------------------------------------------
  # NestJS API — Backend application
  # Uncomment ini setelah apps/api siap dikontainerisasi
  # ---------------------------------------------------------------------------
  # api:
  #   build:
  #     context: ./apps/api
  #     dockerfile: Dockerfile
  #   container_name: racik_api
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "${API_PORT:-3001}:3001"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   networks:
  #     - racik_network

# =============================================================================
# Volumes — data persisten antar restart container
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  meilisearch_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  racik_network:
    driver: bridge
